# Test-only agent and persistence patch over the shipped base + headless
# profile. The shared driver owns the turn, so the product runner stays off.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  # dsh-e2e-modelxing: 品牌 base bundle 关闭了 llm-deepseek 行；patch 行只写显式键，
  # 仅重述 config 不会清除 disabled（vendor/include applyEntryPatches 语义），
  # 必须显式 disabled: false 才能在子进程组合中恢复官方 adapter。
  disabled: false
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro
        contextWindow: 128000
        maxTokens: 8192
      - id: deepseek-v4-flash
        contextWindow: 128000
        maxTokens: 8192

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        # dsh-e2e-modelxing: 星模模型映射：deepseek-v4-flash 不在网关在册目录；env 未设（空串）时回落官方字面量。
        model: !!js "process.env.DEEPSEEK_E2E_MODEL || 'deepseek-v4-flash'"
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
